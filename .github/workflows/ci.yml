name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dev dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Pinned: the mod targets the experimental function-hook API, so an
      # unpinned CLI turns an upstream release into a red build. Bump this
      # deliberately, after running the suite against the new version.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.306

      - name: Show Claude Code version
        run: claude --version

      - name: Validate plugin
        run: claude plugin validate .

      - name: Run mod tests
        run: claude plugin test .
